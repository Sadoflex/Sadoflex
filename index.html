<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadoflex Cursos</title>

    <style>
        body {
            margin: 0;
            background-color: red;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: white;
            margin-top: 50px;
            font-size: 40px;
        }

        details {
            width: 500px;
            margin: 30px auto;
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
        }

        summary {
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .aula {
            margin-top: 15px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 8px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Aulas</h1>

    <details>
        <summary>Aulas de Pneumática</summary>

        <div class="aula">
            Aula: Como usar a máquina pneumática
        </div>

    </details>

</body>
</html>
